title: Folium
author: Roy Francis
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    typst:
      keep-typ: false
      number-sections: true
      section-numbering: 1.1.1
      columns: 1
      mainfont: "Lato"
      papersize: "a4"
      margin-left: 2.15cm
      margin-right: 2.15cm
      margin-top: 3cm
      margin-bottom: 3cm
      # Default cover settings, exposed to users as `folium:`. folium.lua copies
      # these into any `folium` key the document did not set. They live under a
      # reserved name because a top-level `folium:` in document frontmatter
      # replaces the whole merged map before the filter runs.
      folium-defaults:
        class: "NBIS REPORT"
        logo:
          path: assets/nbis-scilifelab.svg
        logo-height: 0.8cm
        font-size: 12pt
        background:
          path: assets/bg.png
      template-partials:
        - typst-template.typ
        - typst-show.typ
      filters:
        - folium.lua
      font-paths:
        - fonts
      folium-assets:
        fontawesome: assets/fontawesome
